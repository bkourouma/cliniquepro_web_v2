# Images construites sur GitHub, déploiement du digest exact sans compilation sur le VPS.
# Les fichiers .env du serveur sont exclus de la synchronisation ; les volumes restent conservés.
name: Déploiement
"on":
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: deploiement-cliniquepro-site
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verifier:
    name: Vérifications
    uses: ./.github/workflows/ci.yml
  build:
    name: Image GHCR construite sur GitHub
    needs: verifier
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier l'image immuable
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/bkourouma/cliniquepro-site:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://cliniquepro-web.allianceconsultants.net' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://cliniquepro.allianceconsultants.net/demo-login' }}
            NEXT_PUBLIC_BOOKING_URL=${{ vars.NEXT_PUBLIC_BOOKING_URL || 'https://calendly.com/immotopia/demo-cliniquepro' }}
            GOOGLE_SITE_VERIFICATION=${{ secrets.GOOGLE_SITE_VERIFICATION }}
            BING_SITE_VERIFICATION=${{ secrets.BING_SITE_VERIFICATION }}
  deployer:
    name: Déployer sur alliance
    needs:
      - verifier
      - build
    runs-on:
      - self-hosted
      - linux
      - x64
      - cliniquepro-site
    timeout-minutes: 25
    env:
      APP_DIR: /home/deployer/apps/cliniquepro-web-v2
      APP_URL: http://127.0.0.1:3030
      IMAGE: cliniquepro-site
      PUBLIC_APP_URL: https://cliniquepro-web.allianceconsultants.net
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la branche publiée
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT_SHA" = "$GITHUB_SHA" || { echo "::error::Commit dépassé : aucun déploiement."; exit 1; }
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Synchroniser le code vers le serveur
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json && test -f Dockerfile && test -f docker-compose.yml
          test -d "$APP_DIR" || { echo "::error::$APP_DIR introuvable"; exit 1; }

          # Image actuelle gardée sous une étiquette de retour arrière.
          ROLLBACK_TAG="avant-ci-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          if docker image inspect "$IMAGE:latest" >/dev/null 2>&1; then
            docker tag "$IMAGE:latest" "$IMAGE:$ROLLBACK_TAG"
            echo "ROLLBACK_TAG=$ROLLBACK_TAG" >> "$GITHUB_ENV"
            echo "Image de retour arrière : $IMAGE:$ROLLBACK_TAG"
          fi

          # --delete retire les fichiers supprimés du dépôt ; les exclusions
          # protègent aussi ces fichiers côté serveur (pas de --delete-excluded) :
          # .env éventuel, dépôt git du dossier, dépendances, caches de build.
          rsync -rlt --delete --stats \
            --include='.env.example' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='*.tgz' --exclude='deploy.log' \
            ./ "$APP_DIR/"
      - name: Tirer l'image GitHub et relancer sans construction
        shell: bash
        working-directory: /home/deployer/apps/cliniquepro-web-v2
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BUILT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          IMAGE_REF="ghcr.io/bkourouma/cliniquepro-site@$BUILT_DIGEST"
          docker pull "$IMAGE_REF"
          IMAGE_SHA=$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$IMAGE_SHA" = "$GITHUB_SHA"
          CURRENT_SHA=$(git -C "$GITHUB_WORKSPACE" ls-remote origin refs/heads/main | cut -f1)
          test "$CURRENT_SHA" = "$GITHUB_SHA" || { echo "::error::Commit dépassé : ancien conteneur conservé."; exit 1; }
          docker tag "$IMAGE_REF" "cliniquepro-site:latest"
          echo "replace_attempted=true" >> "$GITHUB_OUTPUT"
          docker compose up -d --no-build --pull never web
          docker compose ps
        id: deploy_image
        env:
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
      - name: Contrôle de santé
        shell: bash
        run: |
          set +e
          set -uo pipefail
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          check() {
            for i in $(seq 1 30); do
              status=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 10 "${2:-$APP_URL}$1")
              served_sha=$(awk -F ': *' 'tolower($1) == "x-commit-sha" { sub(/\r$/, "", $2); print $2 }' "$headers")
              if [ "$status" = "200" ] && [ "$served_sha" = "$GITHUB_SHA" ]; then
                echo "OK $1 SHA $served_sha (tentative $i)"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          if check /robots.txt && check / && check / "$PUBLIC_APP_URL"; then
            echo "Déploiement de ${GITHUB_SHA::7} en ligne."
            exit 0
          fi

          echo "::error::Contrôle de santé en échec après le déploiement de ${GITHUB_SHA::7}"
          docker logs --tail 60 cliniquepro-site 2>&1 || true

          # Retour arrière automatique sur l'image d'avant, si elle existe.
          if [ -n "${ROLLBACK_TAG:-}" ] && docker image inspect "$IMAGE:$ROLLBACK_TAG" >/dev/null 2>&1; then
            echo "Retour arrière sur $IMAGE:$ROLLBACK_TAG"
            docker tag "$IMAGE:$ROLLBACK_TAG" "$IMAGE:latest"
            (cd "$APP_DIR" && docker compose up -d --no-build --pull never)
            sleep 10
            curl -fsS -o /dev/null --max-time 10 "$APP_URL/" \
              && echo "Ancienne version rétablie." \
              || echo "::error::L'ancienne version ne répond pas non plus : intervention manuelle nécessaire."
          fi
          exit 1
        if: ${{ always() && steps.deploy_image.outputs.replace_attempted == 'true' }}
      - name: Nettoyer les images
        if: always()
        shell: bash
        run: |
          # Couches orphelines, puis on ne garde que les 5 dernières étiquettes de retour arrière.
          docker image prune -f >/dev/null || true
          docker image ls "$IMAGE" --format '{{.Tag}}' | grep '^avant-ci-' | sort -r | tail -n +6 \
            | xargs -r -I{} docker rmi "$IMAGE:{}" || true
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: read
